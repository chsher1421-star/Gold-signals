name: Gold VSA Alerts

on:
  workflow_dispatch: {}

concurrency:
  group: gold-vsa-alerts
  cancel-in-progress: false   # lets you manually trigger a run from the Actions tab, for testing

permissions:
  contents: write   # needed so the workflow can commit the updated state.json back

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          NOTIFY_METHOD: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          
          CTRADER_ENVIRONMENT: ${{ secrets.CTRADER_ENVIRONMENT }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_TOKEN_EXPIRES_AT: ${{ secrets.CTRADER_TOKEN_EXPIRES_AT }}
          CTRADER_SYMBOL_NAME: XAUUSD
          GITHUB_PAT: ${{ secrets.CTRADER_GITHUB_PAT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/main.py

      - name: Commit updated state
        run: |
          git config user.name "gold-vsa-bot"
          git config user.email "gold-vsa-bot@users.noreply.github.com"

          git add state.json

          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update signal state [skip ci]"

          git pull --rebase origin main

          git push origin main
