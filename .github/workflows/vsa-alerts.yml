name: Gold VSA Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab, for testing

permissions:
  contents: write   # needed so the workflow can commit the updated state.json back

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: practice
          NOTIFY_METHOD: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/main.py

      - name: Commit updated state
        run: |
          git config user.name "gold-vsa-bot"
          git config user.email "gold-vsa-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update signal state [skip ci]"
          git push
